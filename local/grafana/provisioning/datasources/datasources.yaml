apiVersion: 1

# Fixed UIDs: dashboards and cross-signal links refer to them.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # metric -> trace: exemplar dots on latency panels open the trace in Tempo
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      # trace -> logs: every span gets a "Logs for this span" button
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      # trace -> metrics
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-10m"
        spanEndTimeShift: "10m"
        tags: [{ key: service.name, value: service_name }]
        queries:
          - name: Request rate
            query: sum(rate(traces_span_metrics_calls_total{$$__tags}[1m]))
          - name: Error rate
            query: sum(rate(traces_span_metrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[1m]))
      lokiSearch:
        datasourceUid: loki

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # log -> trace: trace_id from OTLP structured metadata becomes a link
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open trace

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
