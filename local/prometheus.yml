global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local-stand

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - container.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.container.name
    - k8s.deployment.name
    - k8s.node.name
    - kafka.cluster.alias

storage:
  tsdb:
    out_of_order_time_window: 30m

rule_files:
  - /etc/prometheus/rules/recording.compose.yaml
  - /etc/prometheus/rules/recording.common.yaml
  - /etc/prometheus/rules/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
