# grafana-community/loki 21.2.3 (Loki 3.7), monolithic, filesystem storage. Logs for 7 days.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true   # trace_id / span_id from OTLP
    volume_enabled: true
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes: [service.name, service.namespace, k8s.namespace.name]
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1536Mi }
  persistence:
    enabled: true
    size: 20Gi

# Not needed on a one-node stand.
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
